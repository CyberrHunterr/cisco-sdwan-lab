! Phase 4 baseline for vEdge-PRS2
! Phase-specific onboarding configuration only.
! Later Phase 5 OSPF configuration intentionally excluded.

system
 host-name vEdge-PRS2
 system-ip 55.55.55.51
 site-id 50
 organization-name appbee-sdwan-project
 vbond 100.10.1.12
!

vpn 0
 interface ge0/0
  ip address 50.1.2.1/24
  tunnel-interface
   encapsulation ipsec
   color mpls
   allow-service dhcp
   allow-service dns
   allow-service icmp
   allow-service netconf
   allow-service ospf
   allow-service https
  !
  no shutdown
 !
 interface ge0/1
  ip address 50.2.2.1/24
  tunnel-interface
   encapsulation ipsec
   color public-internet
   allow-service dhcp
   allow-service dns
   allow-service icmp
   allow-service https
  !
  no shutdown
 !
 ip route 0.0.0.0/0 50.2.2.2
!

vpn 512
 interface eth0
  ip dhcp-client
  no shutdown
 !
!
