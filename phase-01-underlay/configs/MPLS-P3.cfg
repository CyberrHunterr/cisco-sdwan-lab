! ============================================================
! Phase 1 reconstructed core configuration
! Device: MPLS-P3
! Current later-phase Internet-side link is excluded.
! ============================================================

hostname MPLS-P3

ip cef
mpls label protocol ldp

interface Loopback0
 ip address 2.2.2.3 255.255.255.255
!

interface Ethernet0/0
 description TO_MPLS-P4
 ip address 8.8.8.1 255.255.255.252
 no shutdown
!

interface Ethernet0/1
 description TO_MPLS-P1
 ip address 6.6.6.2 255.255.255.252
 no shutdown
!

router ospf 1
 mpls ldp autoconfig
 router-id 2.2.2.3
 network 0.0.0.0 255.255.255.255 area 0
!

mpls ldp router-id Loopback0

end
