! ============================================================
! Phase 1 reconstructed configuration
! Device: Internet Router
! Purpose: external-facing DHCP interface + PE reachability
! ============================================================

hostname internet

interface Ethernet0/0
 description TO_PE_ROUTER
 ip address 100.2.1.2 255.255.255.0
 no shutdown
!

interface Ethernet2/0
 description TO_PUBLIC_INTERNET
 ip address dhcp
 no shutdown
!

! Historical Phase 1 report used the exit interface as the default route.
ip route 0.0.0.0 0.0.0.0 Ethernet2/0

end
