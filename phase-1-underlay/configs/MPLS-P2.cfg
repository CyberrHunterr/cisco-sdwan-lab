! ============================================================
! Phase 1 reconstructed core configuration
! Device: MPLS-P2
! ============================================================

hostname MPLS-P2

ip cef

interface Loopback0
 ip address 2.2.2.2 255.255.255.255
 ip ospf 1 area 0
!

interface Ethernet0/0
 description TO_MPLS-P1
 ip address 5.5.5.2 255.255.255.252
 mpls ip
 no shutdown
!

interface Ethernet0/1
 description TO_MPLS-P4
 ip address 7.7.7.1 255.255.255.252
 mpls ip
 no shutdown
!

router ospf 1
 mpls ldp autoconfig
 router-id 2.2.2.2
 network 0.0.0.0 255.255.255.255 area 0
!

mpls ldp router-id Loopback0 force

end
