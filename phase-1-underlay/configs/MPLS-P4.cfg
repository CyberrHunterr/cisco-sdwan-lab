! ============================================================
! Phase 1 reconstructed core configuration
! Device: MPLS-P4
! Current later-phase site-facing interfaces are excluded.
! ============================================================

hostname MPLS-P4

ip cef

interface Loopback0
 ip address 2.2.2.4 255.255.255.255
!

interface Ethernet0/0
 description TO_MPLS-P3
 ip address 8.8.8.2 255.255.255.252
 no shutdown
!

interface Ethernet0/1
 description TO_MPLS-P2
 ip address 7.7.7.2 255.255.255.252
 no shutdown
!

router ospf 1
 mpls ldp autoconfig
 router-id 2.2.2.4
 network 0.0.0.0 255.255.255.255 area 0
!

mpls ldp router-id Loopback0 force

end
