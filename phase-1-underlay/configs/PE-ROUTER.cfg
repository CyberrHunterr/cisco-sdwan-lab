! ============================================================
! Phase 1 reconstructed configuration
! Device: PE-ROUTER
! Purpose: PE handoff, OSPF, MPLS/LDP and Internet default route
! ============================================================

hostname PE-ROUTER

ip cef
mpls label protocol ldp

interface Ethernet0/0
 description CONTROLLER_NETWORK
 ip address 100.10.1.10 255.255.255.0
 no shutdown
!

interface Ethernet0/1
 description HEAD_OFFICE_SIDE
 ip address 1.1.1.1 255.255.255.0
 no shutdown
!

interface Ethernet0/2
 description TO_MPLS-P1
 ip address 100.1.1.1 255.255.255.0
 ip ospf network point-to-point
 mpls ip
 no shutdown
!

interface Ethernet0/3
 description TO_INTERNET_ROUTER
 ip address 100.2.1.1 255.255.255.0
 mpls ip
 no shutdown
!

router ospf 1
 router-id 1.1.1.0
 network 100.1.1.0 0.0.0.255 area 0
 network 100.2.1.0 0.0.0.255 area 0
!

ip route 0.0.0.0 0.0.0.0 100.2.1.2

end
