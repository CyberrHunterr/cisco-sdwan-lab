! Phase 5 — vEdge-PRS2 MPLS OSPF
system
 host-name vEdge-PRS2
 system-ip 55.55.55.51
 site-id 50
 organization-name appbee-sdwan-project
 vbond 100.10.1.12
!

vpn 0
 interface ge0/0
  ip address 50.1.2.1/24
  no shutdown
 !
 router
  ospf
   router-id 55.55.55.51
   timers spf 200 1000 10000
   area 0
    interface ge0/0
     network point-to-point
    exit
   exit
  !
 !
!
