vpn 2
 interface ge0/3
  ip address 172.16.42.1/24
  no shutdown
  vrrp 40
   priority 200
   track-omp
   ipv4 172.16.42.254
  !
  dhcp-server
   address-pool 172.16.42.0/24
   exclude 172.16.42.1 172.16.42.2 172.16.42.254
   options
    default-gateway 172.16.42.254
    dns-servers 8.8.8.8
   !
  !
 !
 interface loopback0
  ip address 40.40.40.1/24
  no shutdown
 !
 router
  ospf
   router-id 40.40.40.1
   default-information originate
   distance intra-area 210
   area 0
    interface ge0/3
     cost 5
    exit
    interface loopback0
    exit
   exit
  !
  bgp 65040
   router-id 40.40.40.1
   address-family ipv4-unicast
    no redistribute omp
   !
   neighbor 40.40.40.2
    description To_vEdge-LDN2_iBGP
    no shutdown
    remote-as 65040
    update-source loopback0
    next-hop-self
   !
   neighbor 40.40.40.100
    no shutdown
    remote-as 65040
    update-source loopback0
    next-hop-self
   !
   neighbor 30.30.30.1
    description To_vEdge-DC-DCI_eBGP
    no shutdown
    remote-as 65030
    update-source loopback0
    ebgp-multihop 2
   !
  !
 !
!
