!
! Phase 3 - Root Certificate Authority
!

hostname IOS-Root-CA

!
! Controller-side interface
!
interface GigabitEthernet0/0
 ip address 100.10.1.100 255.255.255.0
 no shutdown

!
! External / DHCP interface
!
interface GigabitEthernet0/1
 ip address dhcp
 no shutdown

!
! Default route toward PE Router
!
ip route 0.0.0.0 0.0.0.0 100.10.1.10

!
! RSA key pair
!
crypto key generate rsa label PKI modulus 2048

!
! HTTP service
!
ip http server

!
! Certificate Authority
!
crypto pki server PKI
 database url flash:
 database level complete
 issuer-name cn=rootca.lab.local
 hash sha256
 grant auto
 no shutdown

!
! Export Root CA certificate
!
crypto pki export PKI pem url flash:

!
! Make Root CA certificate available to controllers
!
tftp-server flash:PKI.ca

!
end
