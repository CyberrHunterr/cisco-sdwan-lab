!
! Phase 3 - vManage PKI Onboarding
! Phase-specific certificate workflow commands only.
!

!
! Download Enterprise Root CA certificate
!
request download tftp://100.10.1.100/PKI.ca

!
! Fallback transfer method if direct download fails
!
! vshell
! tftp -g -r PKI.ca 100.10.1.100

!
! Install Root CA chain
!
request root-cert-chain install home/admin/PKI.ca

!
! vManage GUI steps used in this phase:
! Administration > Settings
!   Organization Name: appbee-sdwan-project
!   vBond: 100.10.1.12
!   Controller Certificate Authorization: Enterprise Root Certificate
!
! Configuration > Certificate > Controllers
!   Generate CSR
!   Copy CSR to Root CA
!   Install granted certificate
!
! Verification:
! show control local-properties
! show control connections
!
