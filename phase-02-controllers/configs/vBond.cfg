! Phase 2 — vBond
! Sanitized from current live configuration.
! Authentication hashes intentionally removed.

system
 host-name vbond
 system-ip 55.55.10.2
 site-id 10
 organization-name appbee-sdwan-project
 vbond 100.10.1.12 local
!

vpn 0
 interface ge0/0
  ip address 100.10.1.12/24
  tunnel-interface
   encapsulation ipsec
   allow-service all
  !
  no shutdown
 !
 ip route 0.0.0.0/0 100.10.1.10
!

vpn 512
 interface eth0
  ip address 100.10.1.12/24
  no shutdown
 !
!
