! Phase 2 — vSmart1
! Sanitized from current live configuration.
! Authentication hashes intentionally removed.

system
 host-name vSmart1
 system-ip 55.55.10.3
 site-id 10
 organization-name appbee-sdwan-project
 vbond 100.10.1.12
!

vpn 0
 interface eth1
  ip address 100.10.1.13/24
  tunnel-interface
   allow-service all
   allow-service dhcp
   allow-service dns
   allow-service icmp
   no allow-service sshd
   no allow-service netconf
   no allow-service ntp
   no allow-service stun
  !
  no shutdown
 !
 ip route 0.0.0.0/0 100.10.1.10
!

vpn 512
 interface eth0
  ip address 100.10.1.13/24
  no shutdown
 !
!
